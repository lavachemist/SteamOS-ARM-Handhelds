# The Frame's user.conf keeps the whole session (gamescope, Xwayland, Steam)
# on cpu0-4, so on SM8550 it never reaches the A710s or the X3 (on SM8650,
# the X4 and two of the A720s). Give it every
# core. An empty CPUAffinity= would not do: the user manager would inherit
# PID 1's system.conf mask (cpu1-4).
[Manager]
CPUAffinity=0-7
