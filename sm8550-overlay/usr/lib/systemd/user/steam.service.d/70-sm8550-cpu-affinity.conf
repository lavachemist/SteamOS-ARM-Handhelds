[Service]
# The Frame's steam.service pins games and desktop apps to cpu3-7 (0xf8), a
# split made for the Frame's CPU. On SM8550 and SM8650 let games run on
# every core and leave placement to the scheduler (sm8550-boostd or konkrd
# add a uclamp hint; konkrd also keeps game threads off the little cores).
Environment=STEAM_LAUNCH_WRAPPER_AFFINITY_LIST=0xff
Environment=STEAM_DESKTOP_APP_AFFINITY_LIST=0xff
