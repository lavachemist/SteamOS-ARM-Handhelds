[Service]
# The Frame's steam.service pins games and desktop apps to cpu3-7 (0xf8), a
# split made for the Frame's CPU. On SM8550 let games run on every core and
# leave placement to EAS (sm8550-boostd adds a uclamp hint, no pin).
Environment=STEAM_LAUNCH_WRAPPER_AFFINITY_LIST=0xff
Environment=STEAM_DESKTOP_APP_AFFINITY_LIST=0xff
