# SM8550 handhelds ship with 8 GB (Retroid Pocket 6 base model). SteamOS's
# zram0 (lzo-rle, half of RAM = 3.7 GB) filled up in Palworld after ~15 min
# and the game hung. zstd packs more into the same RAM (ratio 5.8 vs 4.2 on
# idle session memory, ~2.3 on Palworld's data) and a RAM-sized device gives
# the room: Palworld ran 25+ min with 5.4 GB swapped in 1.9 GB of RAM,
# memory pressure mostly < 1 %. zstd costs CPU (write ~380 vs ~1100 MB/s,
# read ~1060 vs ~2600 MB/s on one core), which only matters while swapping.
# The size is only a cap (zram holds RAM only for what it stores); 8 GB at
# most, so on 12/16 GB models poorly compressible data cannot take so much
# RAM that the system thrashes instead of the OOM killer ending the game.
[zram0]
zram-size = min(ram, 8192)
compression-algorithm = zstd
