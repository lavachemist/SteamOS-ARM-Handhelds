# TEO cpuidle governor instead of menu (menu wins by default on rating).
# Retroid Pocket 6, Easy Delivery Co. under LAVD, two 90 s runs each:
# same frame rate (52.0 vs 52.3 fps, 1 % low 31.1 vs 31.5), 6.54 vs 6.84 W,
# 2-5 C cooler. In game, menu kept sending cores into cpu-sleep (1.3-1.9 ms
# exit latency) ~15x more often than TEO, which stayed in WFI between frames.
# "w-": a kernel built without TEO just skips this.
w- /sys/devices/system/cpu/cpuidle/current_governor - - - - teo
