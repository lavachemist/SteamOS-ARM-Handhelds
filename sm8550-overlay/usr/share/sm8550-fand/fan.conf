# sm8550-fand factory settings. Override any key in /etc/sm8550-fand.conf
# (same sections), then `sudo systemctl reload sm8550-fand`.
#
# Curves and [fan] values are Armada's factory power-profiles.conf
# (armada-os/armada, GPL-2.0-or-later), plus max (full speed). Curve points
# are temp_C:pwm (0..255), linearly interpolated. On the AYN Thor, Barry
# Launcher's dashboard picks the profile (/var/lib/steamos-sm8550/fan-profile.conf,
# which wins over both files).

[general]
# eco | balanced | performance | max
profile=balanced

[profile.eco]
fan_curve=relaxed

[profile.balanced]
fan_curve=moderate

[profile.performance]
fan_curve=aggressive

[profile.max]
fan_curve=full

[fan_curve.relaxed]
curve=98:255,94:204,88:153,82:102,76:77,65:51,0:51

[fan_curve.moderate]
curve=96:255,90:204,84:153,78:102,72:77,55:51,0:51

[fan_curve.aggressive]
curve=90:255,85:204,80:153,74:102,66:77,45:51,0:51

[fan_curve.full]
curve=0:255

[fan]
min_pwm=51
max_pwm=255
# largest pwm change per 3 s tick
ramp_up=36
ramp_down=6
# weight of the previous temperature (0 = no smoothing)
smoothing=0.50
pwm_quantum=8
