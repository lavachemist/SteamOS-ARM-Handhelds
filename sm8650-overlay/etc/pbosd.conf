# pbosd — KONKR Pocket FIT platform daemon. `sudo systemctl restart pbosd`
# after editing (or `pbosctl profile …` for the profile itself).

[buttons]
# F13/F14/F15 come from the InputPlumber keyboard; the MCU extra buttons are
# mapped to them in /etc/inputplumber/capability_maps.d/konkr_pocketfit_sysbtn.yaml
# Actions: profile-next | profile-lowpower | profile-balanced | rgb-next |
#          sticks-toggle | none
# Front-top-right (Performance button)
F14 = profile-next
# Front-bottom-right
F13 = rgb-next
F15 = none

[fan]
enabled = yes
# floor for the curve (0..255); raise it if you prefer a constant hum
min_pwm = 0
# written if pbosd stops or crashes
failsafe_pwm = 180

[games]
# uclamp.min boost + keep game threads off the A520 little cores
boost = yes
avoid_little_cores = yes
