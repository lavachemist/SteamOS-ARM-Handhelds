# KONKR Pocket FIT: a fixed 1024-frame (21 ms) quantum on the internal card.
# 512 forced every client — including FEX-emulated games, which cannot always
# refill 10 ms in time — into tiny buffers and they crackled. Kept fixed (not
# dynamic) because quantum switches glitch on the q6apm DSP.
#
# Playback is interrupt-driven (api.alsa.disable-tsched). With PipeWire's
# default timer-based scheduling it writes just ahead of the position the
# driver reports, but q6apm reports it only in 10 ms steps and the DSP reads
# ahead of it. The DSP then played chunks before PipeWire had written them:
# short, sharp sounds (Steam's menu sounds) stuttered, while steady tones hid
# it. PipeWire logged no xruns, and its monitor stayed clean. Writing whole
# periods on the DSP's period interrupts removes the race.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.platform-sound.*" } ]
    actions = { update-props = { node.force-quantum = 1024, api.alsa.disable-tsched = true } }
  }
  {
    matches = [ { node.name = "~alsa_input.platform-sound.*" } ]
    actions = { update-props = { node.force-quantum = 1024 } }
  }
]
