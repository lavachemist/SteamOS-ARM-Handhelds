# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
# KONKR Pocket FIT / AYANEO Pocket S2 (SM8650) → virtual Steam Deck
# controller (deck-uhid; valid in InputPlumber ≥ 0.70 even though the
# bundled JSON schema does not list it) + keyboard (OSK, F13/F14 hotkeys).
#
# Sources (each optional — the composite forms from whichever appear):
#   - built-in pad: XInput on the internal USB bus (045e:028e; older MCU
#     firmware enumerates as 1c4f:0002; HID firmware as 4001:0428), plus
#     anything else on its internal port (usb-0001:01:00.0-2) whatever id it
#     reports. On 4001:0428 its hidraw node drives the rumble motors (blocked
#     for now, see below).
#   - "KONKR System Buttons": konkr_sysbtn MCU driver (opt-in, konkr-mcu).
version: 1
kind: CompositeDevice
name: KONKR Pocket FIT

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: KONKR Pocket FIT
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: AYANEO Pocket S2

single_source: false

source_devices:
  - group: gamepad
    evdev:
      vendor_id: "045e"
      product_id: "028e"
      handler: event*
    capability_map_id: konkr_pocketfit_deck
  - group: gamepad
    evdev:
      vendor_id: "1c4f"
      product_id: "0002"
      handler: event*
    capability_map_id: konkr_pocketfit_deck
  # HID gamepad firmware ("AYANEO Controller"): hid-generic puts the right
  # stick on ABS_Z/ABS_RZ and swaps X/Y vs xpad, so it needs its own map.
  # Listed before the internal-port catch-all below so it wins.
  - group: gamepad
    evdev:
      vendor_id: "4001"
      product_id: "0428"
      handler: event*
    capability_map_id: konkr_pocketfit_hid
  # Rumble motors: the pad takes an 8-byte HID output report (byte 4 left,
  # byte 5 right), which InputPlumber >= 0.79 drives (ayaneo_haptics).
  # Blocked for now: in 0.81.0 that driver polls every 0 ms with a
  # non-blocking poll, so it keeps one CPU core at 100%. Blocked uses the
  # idle 500 ms driver instead (no rumble in HID mode). Remove "blocked"
  # once InputPlumber fixes it. Listing the node here still keeps
  # InputPlumber's own 50-konkr_pocket_fit.yaml from claiming it and creating
  # a second, empty controller.
  - group: gamepad
    blocked: true
    hidraw:
      vendor_id: 0x4001
      product_id: 0x0428
      interface_num: 0
  # Whatever is on the pad's internal USB port: some units report another
  # USB id (controller mode/firmware), and unclaimed, Steam shows the raw pad
  # with the Xbox layout and no Quick Access. InputPlumber matches phys_path
  # literally (no globs); tested on hardware.
  - group: gamepad
    evdev:
      phys_path: usb-0001:01:00.0-2/input0
      handler: event*
    capability_map_id: konkr_pocketfit_deck
  - group: gamepad
    evdev:
      name: KONKR System Buttons
      handler: event*
    capability_map_id: konkr_pocketfit_sysbtn

options:
  auto_manage: true

target_devices:
  - deck-uhid
  - keyboard
