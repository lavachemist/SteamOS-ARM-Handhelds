[inputplumber]
# keyboard target carries F13/F14 from the MCU buttons (KONKR → stick lights,
# Performance → profile) to pbosd; steamos-manager applies this list at
# session start, so dropping "keyboard" here silently kills those buttons.
target_devices = ["deck-uhid", "keyboard"]
