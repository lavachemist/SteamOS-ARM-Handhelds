# KONKR Pocket FIT speaker processing, run by konkr-speaker-dsp.service as
# its own PipeWire client (like filter-chain.service).
#
# The upstream machine driver caps the WSA884x speakers at 0 dB amplifier
# gain and -3 dB digital gain, because Linux has no speaker protection for
# them, so they are much quieter than on Android. Steam's UI sounds peak
# around -10 dBFS on top of that. This chain gets loudness back without
# raising those caps:
#
#   1. 250 Hz high-pass (12 dB/oct). The speakers do not reproduce this
#      range (100/200 Hz tones are inaudible on the device); it only moves
#      the cones and eats headroom.
#   2. konkr_limiter: +12 dB make-up gain into a stereo look-ahead limiter
#      at -1 dBFS (5 ms latency). Peaks never exceed full scale, so the
#      loudest possible output is unchanged; quiet audio gets louder.
#
# It is a WirePlumber smart filter on the speaker sink only: streams to the
# speakers go through it, headphones and DisplayPort do not. The volume bar
# (konkr-volume, WSA digital volume) is applied after it, in the codec.

context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
      args = { }
      flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }

    { name = libpipewire-module-filter-chain
      args = {
        node.description = "Speakers (processed)"
        media.name       = "Speakers (processed)"
        filter.graph = {
          nodes = [
            { type = builtin name = hpL label = bq_highpass
              control = { "Freq" = 250.0 "Q" = 0.707 } }
            { type = builtin name = hpR label = bq_highpass
              control = { "Freq" = 250.0 "Q" = 0.707 } }
            # Found as konkr_limiter.so on LADSPA_PATH (default /usr/lib/ladspa).
            { type = ladspa name = lim plugin = "konkr_limiter" label = konkr_limiter
              control = { "Gain (dB)" = 12.0 "Ceiling (dB)" = -1.0 "Release (ms)" = 80.0 } }
          ]
          links = [
            { output = "hpL:Out" input = "lim:In L" }
            { output = "hpR:Out" input = "lim:In R" }
          ]
          inputs  = [ "hpL:In" "hpR:In" ]
          outputs = [ "lim:Out L" "lim:Out R" ]
        }
        capture.props = {
          node.name         = "konkr_speaker_dsp"
          media.class       = Audio/Sink
          audio.position    = [ FL FR ]
          filter.smart      = true
          filter.smart.name = "konkr-speaker-dsp"
          filter.smart.target = { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" }
        }
        playback.props = {
          node.name         = "konkr_speaker_dsp.output"
          node.passive      = true
          audio.position    = [ FL FR ]
          stream.dont-remix = true
        }
      }
    }
]
