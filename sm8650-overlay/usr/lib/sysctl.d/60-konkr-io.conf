# Steam installs write GBs to a microSD that manages ~12 MB/s sequential and
# ~1.6 MB/s of 4K writes. The default dirty_ratio=20 (~2.3 GB on 12 GB RAM)
# built a minutes-long backlog that froze the UI; 128 MB (tried first) made
# every writer — including the Steam UI's cache — stall in dirty throttling.
# 512 MB absorbs download bursts in RAM, background flushing starts at 64 MB,
# and BFQ + pbosd's per-process I/O priorities keep UI/game reads first.
vm.dirty_bytes = 536870912
vm.dirty_background_bytes = 67108864
