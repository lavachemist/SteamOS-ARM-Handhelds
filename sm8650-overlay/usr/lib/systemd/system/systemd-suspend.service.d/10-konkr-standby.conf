# KONKR Pocket FIT: Steam's Sleep → logind → this unit → konkr-suspend, which
# runs konkr-standby by default (no kernel suspend) or, after
# `pbosctl sleep s2idle`, real s2idle prepared by konkr-sleep.service.
[Unit]
ConditionPathExists=/usr/lib/konkr/konkr-suspend

[Service]
ExecStart=
ExecStart=/usr/lib/konkr/konkr-suspend
