# Start WirePlumber only once sm8550-audio-setup has configured the sound card
# (it creates /run/sm8550-audio-ready when it exits). The card only appears
# ~9 s after power-on, once the ADSP firmware is up. sm8550-audio-setup no
# longer holds boot (Type=exec), so without this WirePlumber and alsaucm could
# set up the card at the same moment, and about 1 boot in 3 had no speaker
# output. Steam and gamescope don't wait for WirePlumber; only audio does.
# Capped at 15 s so audio can never hang on it.
[Service]
ExecStartPre=/bin/sh -c 'i=0; while [ ! -e /run/sm8550-audio-ready ] && [ "$i" -lt 150 ]; do sleep 0.1; i=$((i+1)); done'
