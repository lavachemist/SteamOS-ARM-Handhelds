# Same as /usr/share/... — Frame also reads /etc/wireplumber.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.platform-sound" }
    ]
    actions = {
      update-props = {
        api.acp.disable-pro-audio = false
        api.acp.auto-profile = false
        api.acp.auto-port = false
        api.alsa.use-acp = true
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.platform-sound.*" }
    ]
    actions = {
      update-props = {
        audio.channels = 2
        audio.format = "S16LE"
        audio.rate = 48000
        audio.position = "FL,FR"
        api.alsa.period-size = 1024
        api.alsa.headroom = 2048
        node.force-quantum = 512
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.platform-sound.HiFi__Speaker__sink" }
    ]
    actions = {
      update-props = {
        priority.session = 2000
        priority.driver = 2000
        node.description = "Speakers"
      }
    }
  }
  {
    # Frame's 50-alsa-config.conf wraps every built-in mic in a loopback
    # device (node.create-loopback) for its own mic processing chain. On
    # SM8550 capturing through that wrapper killed PipeWire (SIGKILL, over
    # and over) as soon as a Discord call opened the mic; use the ALSA
    # input directly.
    matches = [
      { node.name = "~alsa_input.platform-sound.*" }
    ]
    actions = {
      update-props = {
        node.create-loopback = false
      }
    }
  }
]
